# 鍼灸院 予約管理アンケート v6.16 設問定義
# Claude Code 実装用

metadata:
  version: "6.16"
  title: "鍼灸院 予約管理に関するアンケート"
  description: "予約管理の実態と乗り換え意向・障壁の把握"
  estimated_minutes:
    min: 4.5
    max: 6.5
  target_responses:
    min: 425
    max: 850
  spreadsheet_id: "1CiuXRdYG-lI_jWA4DiR_uXvYU9dgqTE1v-JWsZF1l_g"
  sheet_name: "survey_responses"

sections:
  - id: A
    title: "基本情報"
    questions: [Q1, Q2]

  - id: B
    title: "現在の予約台帳と集客"
    questions: [Q3, Q4, Q4_2]

  - id: C
    title: "課題・ニーズ把握"
    questions: [Q5, Q6, Q7]

  - id: D
    title: "利用シーン把握"
    questions: [Q8]

  - id: E
    title: "今後への関心"
    questions: [Q9, Q10]

  - id: F
    title: "自由記述"
    questions: [Q11]

questions:
  - id: Q1
    section: A
    type: text
    label: "院名"
    required: true
    validation:
      min_length: 1
      max_length: 100
    column_name: "q1_clinic_name"

  - id: Q2
    section: A
    type: email
    label: "メールアドレス"
    required: true
    validation:
      format: email
      max_length: 200
    column_name: "q2_email"
    note: "院名＋メールアドレスでマスタデータと突合"

  - id: Q3
    section: B
    type: single_choice
    label: "現在、どんなふうに予約管理をしていますか？"
    sub_label: "予約情報を集約している場所"
    required: true
    is_branching_source: true
    options:
      - value: paper
        label: "紙で管理"
      - value: excel
        label: "Excel・Googleスプレッドシートで管理"
      - value: google_calendar
        label: "Googleカレンダーで管理"
      - value: reservation_tool
        label: "予約管理ツール（オンラインの予約システム）"
      - value: other
        label: "その他"
        has_text_input: true
        text_input_placeholder: "具体的にお書きください"
    column_name: "q3_management_type"
    other_text_column: "q3_other_text"
    branches:
      - condition: "value == 'reservation_tool'"
        action: "show_next"
        target: Q4
      - condition: "value != 'reservation_tool'"
        action: "skip"
        target: Q4

  - id: Q4
    section: B
    type: single_choice
    label: "使っている予約管理ツールを教えてください"
    required: true
    display_condition: "Q3 == 'reservation_tool'"
    options:
      - value: stores
        label: "STORES 予約"
      - value: airreserve
        label: "Airリザーブ"
      - value: reserva
        label: "RESERVA"
      - value: onemorehand
        label: "ワンモアハンド"
      - value: hpb
        label: "ホットペッパービューティー(サロンボード)"
      - value: epark
        label: "EPARK"
      - value: ekiten
        label: "エキテン"
      - value: kenkonihari
        label: "健康にはり"
      - value: line_tool
        label: "LINE連携ツール(リピッテ等)"
      - value: ripikuru
        label: "リピくる"
      - value: shinkyu
        label: "しんきゅう予約"
      - value: receipt_machine
        label: "レセコンに付属する予約機能"
      - value: hp_form
        label: "ホームページの予約フォーム"
      - value: other
        label: "その他"
        has_text_input: true
        text_input_placeholder: "具体的にお書きください"
    column_name: "q4_reservation_tool"
    other_text_column: "q4_other_text"

  - id: Q4_2
    section: B
    type: multiple_choice
    label: "集客やネット予約受付のために使っているサービスはありますか？"
    required: true
    options:
      - value: hpb
        label: "ホットペッパービューティー(サロンボード)"
      - value: epark
        label: "EPARK"
      - value: ekiten
        label: "エキテン"
      - value: kenkonihari
        label: "健康にはり"
      - value: shinkyu_compass
        label: "しんきゅう予約・しんきゅうコンパス"
      - value: line_official
        label: "LINE公式アカウント"
      - value: own_website
        label: "自院のホームページ"
      - value: instagram_sns
        label: "Instagram・SNS"
      - value: other
        label: "その他"
        has_text_input: true
      - value: not_using
        label: "ネット集客は活用していない"
        exclusive: true
        dynamic_label:
          when: "Q3 == 'reservation_tool'"
          label: "Q4で選んだサービス以外には活用していない"
    column_name: "q4_2_marketing_channels"
    other_text_column: "q4_2_other_text"

    # Q4で選んだサービスをQ4_2の選択肢から自動除外するルール
    dynamic_filtering:
      enabled: true
      description: "Q4で予約管理ツールを選んだ場合、対応するQ4_2の選択肢を除外"
      rules:
        - when: "Q4 == 'hpb'"
          exclude_options: [hpb]
        - when: "Q4 == 'epark'"
          exclude_options: [epark]
        - when: "Q4 == 'ekiten'"
          exclude_options: [ekiten]
        - when: "Q4 == 'kenkonihari'"
          exclude_options: [kenkonihari]
        - when: "Q4 == 'shinkyu'"
          exclude_options: [shinkyu_compass]
        - when: "Q4 == 'line_tool'"
          exclude_options: [line_official]
        - when: "Q4 == 'hp_form'"
          exclude_options: [own_website]
      exception:
        when: "Q4 == 'other'"
        description: "Q4=その他の場合は除外処理なし、全選択肢を表示"

  - id: Q5
    section: C
    type: multiple_choice
    label: "予約管理で困っていることは？"
    required: false
    options:
      - value: double_booking
        label: "ダブルブッキングが起こる"
        visible_when:
          Q3: [paper, excel, google_calendar, reservation_tool, other]
      - value: input_mistakes
        label: "記入・入力ミスが起こる"
        visible_when:
          Q3: [paper, excel, google_calendar, reservation_tool, other]
      - value: hard_to_read
        label: "字が読みづらい"
        visible_when:
          Q3: [paper, other]
      - value: no_remote_access
        label: "外出先から予約状況を確認できない"
        visible_when:
          Q3: [paper, other]
      - value: hard_to_search_history
        label: "過去の予約履歴を探すのが大変"
        visible_when:
          Q3: [paper, excel, google_calendar, reservation_tool, other]
      - value: staff_share_failure
        label: "スタッフ間の情報共有が漏れる"
        visible_when:
          Q3: [paper, excel, google_calendar, reservation_tool, other]
      - value: double_writing
        label: "予約を別の場所に書き直す二度手間"
        visible_when:
          Q3: [paper, excel, google_calendar, reservation_tool, other]
      - value: aggregation_difficult
        label: "集計・売上分析に手間がかかる"
        visible_when:
          Q3: [paper, excel, google_calendar, reservation_tool, other]
      - value: manual_reminder
        label: "リマインド連絡が手動で大変"
        visible_when:
          Q3: [paper, excel, google_calendar, other]
      - value: no_free_memo
        label: "自由なメモが書き込めない"
        visible_when:
          Q3: [reservation_tool, other]
      - value: no_karte_integration
        label: "電子カルテ等との連携ができない"
        visible_when:
          Q3: [reservation_tool, other]
      - value: complex_operation
        label: "操作が複雑で習得が大変"
        visible_when:
          Q3: [reservation_tool, other]
      - value: no_problem
        label: "特に困っていない"
        exclusive: true
        visible_when:
          Q3: [paper, excel, google_calendar, reservation_tool, other]
      - value: other
        label: "その他"
        has_text_input: true
        visible_when:
          Q3: [paper, excel, google_calendar, reservation_tool, other]
    column_name: "q5_difficulties"
    other_text_column: "q5_other_text"

  - id: Q6
    section: C
    type: multiple_choice
    label: "今の方法で気に入っている点は?"
    required: false
    options:
      - value: familiar
        label: "操作に慣れている"
        visible_when:
          Q3: [paper, excel, google_calendar, reservation_tool, other]
      - value: free_writing
        label: "自由に書き込める"
        visible_when:
          Q3: [paper, excel, other]
      - value: easy_overview
        label: "一覧で見やすい"
        visible_when:
          Q3: [paper, excel, google_calendar, reservation_tool, other]
      - value: no_cost
        label: "コストがかからない"
        visible_when:
          Q3: [paper, excel, google_calendar, other]
      - value: easy_share
        label: "スタッフと共有しやすい"
        visible_when:
          Q3: [paper, excel, google_calendar, reservation_tool, other]
      - value: paper_safety
        label: "紙で残るので安心"
        visible_when:
          Q3: [paper, other]
      - value: no_power_needed
        label: "電源・ネット接続が不要で安心"
        visible_when:
          Q3: [paper, other]
      - value: automated
        label: "予約管理が自動化されている"
        visible_when:
          Q3: [reservation_tool, other]
      - value: access_anywhere
        label: "どこからでもアクセスできる"
        visible_when:
          Q3: [excel, google_calendar, reservation_tool, other]
      - value: nothing
        label: "特になし"
        exclusive: true
        visible_when:
          Q3: [paper, excel, google_calendar, reservation_tool, other]
      - value: other
        label: "その他"
        has_text_input: true
        visible_when:
          Q3: [paper, excel, google_calendar, reservation_tool, other]
    column_name: "q6_likes"
    other_text_column: "q6_other_text"

  - id: Q7
    section: C
    type: multiple_choice
    label: "今の予約管理方法をオンライン化する場合、不安に感じることはありますか?"
    required: false
    options:
      - value: data_migration
        label: "既存データの移行が大変そう"
      - value: learn_operation
        label: "操作を覚えるのが大変"
      - value: staff_training
        label: "スタッフへの教育・浸透"
      - value: incompatible_features
        label: "運用に合わない機能の押し付け"
      - value: no_free_writing
        label: "自由に書き込めなくなる"
      - value: monthly_cost
        label: "月額費用の継続負担"
      - value: system_failure
        label: "通信障害・システム障害"
      - value: elderly_patients
        label: "高齢患者がネット予約を使えない"
      - value: enough_now
        label: "今のままで十分回っている"
      - value: uncertain_effect
        label: "効果が出るか分からない"
      - value: past_failure
        label: "過去のデジタル化失敗の経験"
      - value: no_concern
        label: "特に不安はない"
        exclusive: true
      - value: other
        label: "その他"
        has_text_input: true
    column_name: "q7_concerns"
    other_text_column: "q7_other_text"

  - id: Q8
    section: D
    type: multiple_choice
    label: "予約を予約台帳に記録するタイミングは?"
    required: false
    options:
      - value: immediately
        label: "予約を受けた瞬間"
      - value: between_treatments
        label: "施術の合間"
      - value: end_of_day
        label: "営業終了時などにまとめて"
      - value: auto_recorded
        label: "予約ツールが自動的に記録するため、意識していない"
      - value: not_decided
        label: "特に決まっていない"
      - value: other
        label: "その他"
        has_text_input: true
    column_name: "q8_recording_timing"
    other_text_column: "q8_other_text"

  - id: Q9
    section: E
    type: single_choice
    label: "今より業務効率化や患者対応がスムーズになる予約管理の仕組みに興味は?"
    required: true
    is_branching_source: true
    options:
      - value: very_interested
        label: "とても興味あり"
      - value: conditional
        label: "条件次第で興味あり"
      - value: satisfied
        label: "今のままで満足"
      - value: not_interested
        label: "興味なし"
    column_name: "q9_interest_level"
    branches:
      - condition: "value == 'very_interested' || value == 'conditional'"
        action: "show_next"
        target: Q10
      - condition: "value == 'satisfied' || value == 'not_interested'"
        action: "skip"
        target: Q10

  - id: Q10
    section: E
    type: text_area
    label: "どんな条件・機能・サポートがあれば使いますか?"
    required: false
    display_condition: "Q9 == 'very_interested' || Q9 == 'conditional'"
    validation:
      max_length: 500
    column_name: "q10_required_conditions"

  - id: Q11
    section: F
    type: text_area
    label: "予約管理に関するご意見・要望をご自由にお書きください"
    required: false
    validation:
      max_length: 1000
    column_name: "q11_free_comment"

# データ保存仕様
data_storage:
  type: google_sheets
  spreadsheet_id: "1CiuXRdYG-lI_jWA4DiR_uXvYU9dgqTE1v-JWsZF1l_g"
  sheet_name: "survey_responses"

  # 追加メタデータ列
  metadata_columns:
    - name: "timestamp"
      type: "ISO 8601"
      description: "送信日時"
    - name: "user_agent"
      type: "string"
      description: "ブラウザ情報"
    - name: "completion_time_seconds"
      type: "integer"
      description: "回答所要時間（秒）"

  # 複数選択の保存形式
  multi_select_format:
    delimiter: ","
    description: "選択された値のIDをカンマ区切りで保存"
    example: "double_booking,input_mistakes,hard_to_read"

  # 重複回答の処理
  duplicate_handling:
    key: "q2_email"
    strategy: "overwrite"
    description: "同一メールアドレスの場合は既存レコードを上書き"

# UI/UX 設定
ui_settings:
  layout:
    type: "single_question_per_screen"
    show_progress_bar: true
    show_back_button: true
    show_next_button: true

  styling:
    primary_color: "#（しんきゅうコンパスのブランドカラーに合わせる）"
    font_family: "Yu Gothic, sans-serif"
    min_touch_target_px: 44
    mobile_first: true

  feedback:
    completion_message: "ご回答ありがとうございました。集計結果レポートは後日メールでお送りします。"
    error_messages:
      required: "この項目は必須です"
      email_format: "正しいメールアドレスを入力してください"
      max_length: "文字数の上限を超えています"

  auto_save:
    enabled: true
    storage: "localStorage"
    key_prefix: "survey_v6_16_"

# テスト要件
test_requirements:
  functional:
    - "Q3=紙 → Q4スキップ"
    - "Q3=予約管理ツール → Q4表示"
    - "Q4=しんきゅう予約 → Q4-2でしんきゅう予約・しんきゅうコンパスを除外"
    - "Q4=その他 → Q4-2で除外なし、全選択肢表示"
    - "Q3=紙 → Q4-2の動的文言が「ネット集客は活用していない」"
    - "Q3=予約管理ツール → Q4-2の動的文言が「Q4で選んだサービス以外には活用していない」"
    - "Q3=紙 → Q5に紙ユーザー向け項目（字が読みづらい等）表示"
    - "Q3=Excel → Q5に予約管理ツール向け項目（自由なメモ等）非表示"
    - "Q5で「特に困っていない」選択 → 他選択肢自動クリア"
    - "Q9=興味あり → Q10表示"
    - "Q9=興味なし → Q10スキップ"

  browser:
    - "Chrome 最新版"
    - "Safari 最新版"
    - "Edge 最新版"
    - "Firefox 最新版"

  device:
    - "iPhone (iOS Safari)"
    - "Android (Chrome)"
    - "iPad (Safari)"
    - "PC (Chrome/Safari/Edge)"
